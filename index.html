<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMTEYAZ Catalog</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="logo">🛍️ IMTEYAZ Catalog</div>
</header>

<div class="container">
  <input type="text" id="searchBox" placeholder="🔍 नाम या tag से खोजें...">
  <div id="grid" class="grid"></div>
  <p id="emptyMsg" class="emptyMsg" style="display:none;">कोई भी item नहीं मिला</p>
</div>

<!-- Detail Modal -->
<div id="detailModal" class="detailModal">
  <div class="detailBox">
    <button id="closeDetailBtn" class="closeDetailBtn">✕</button>

    <div class="sliderWrap">
      <div id="sliderTrack" class="sliderTrack"></div>
      <button id="prevSlideBtn" class="sliderNav sliderNavLeft">‹</button>
      <button id="nextSlideBtn" class="sliderNav sliderNavRight">›</button>
      <div id="sliderDots" class="sliderDots"></div>
    </div>

    <div class="detailInfo">
      <h2 id="detailName"></h2>
      <p id="detailPrice" class="detailPrice"></p>
      <p id="detailSize" class="detailSize"></p>
      <p id="detailNote" class="detailNote"></p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="app.js"></script>

</body>
</html>
